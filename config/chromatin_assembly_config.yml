# Chromatin assembly pipeline
# Configuration file

# Note: Run script from within chromatin-assembly/ dir

##### Section 1: Input data and parameters #####
repo_dir: "/scratch3/che318/chromatin-assembly/" # path to the chromatin-assembly directory

# Species name
ref_species: "yeast"

# Merging reads
#   Merging reads is an optional step included in the pipeline, which I recommend running separately
merge_reads: 
  perform_merge:     FALSE # TRUE to merge reads
  read_dir:          "data/yeast/reads/" # file path relative to chromatin-assembly directory i.e., /full/path/to/data/yeast/reads/
  read_path_pattern: "133165_H3NTTDSX3_GTGAAGTG-GAGCAATC" # Separate out the lane number from sample pattern - don't include "_L00" in string here
  read_lanes:        ["1"] # Add specific read numbers to dictionary e.g.,  ["1", "2", "3", "4", "5", "6", "7", "8"]

# Input data paths and details
#   Input for analysis steps, either after merging reads or if using a single lane
#     For a single lane - enter path for R1 and R2 files for that lane
#     For merged reads - enter path for R1 and R2 merged reads, which will be output to the `results/` directory
#
input:
  sample:                "132654_HCJLVDSX2_TTGCGAAG-AACACGCT_L001" # snippet of file path used to identify dataset
  r1:                    "/scratch3/che318/data/yeast/exp/132654_HCJLVDSX2_TTGCGAAG-AACACGCT_L001_R1.fastq.gz"
  r2:                    "/scratch3/che318/data/yeast/exp/132654_HCJLVDSX2_TTGCGAAG-AACACGCT_L001_R2.fastq.gz"
  reference_genome_id:   "S288C_reference_sequence_R64-2-1_20150113.fsa" # identifier for reference genome
  reference_genome_path: "/scratch3/che318/data/yeast/genome/S288C_reference_sequence_R64-2-1_20150113.fsa"
  gff:                   "/scratch3/che318/data/yeast/genome/saccharomyces_cerevisiae_R64-2-1_20150113.gff"

# Input control for peak analysis (Step 8)
input_control: 
  control_directory: "data/yeast/input_control/"
  control_pattern: "132620_HCJLVDSX2_GACGATCT-TCGTGCAT"  # Separate out the lane number id from the sample pattern - don't include "_L00" in string here
  control_lanes: ["1"] # Add specific read numbers to dictionary e.g.,  ["1", "2", "3", "4", "5", "6", "7", "8"]

# Programs and files needed for specific pipeline steps 
#   (file path relative to chromatin-assembly directory i.e., /full/path/to/resources/adapters/adap_cont_rna.fa)
params:
  adapters: "resources/adapters/adap_cont_rna.fa"
  faCount: "resources/faCount"
  faToTwoBit: "resources/faToTwoBit"

##### Section 2: Output names #####
# Names of the output directory generated for each step
output_dir:
  step0: "0_mergedReads"
  step1: "1_repeatmasker"
  step2: "2_fastqc"
  step3: "3_UMIext"
  step4: "4_kalign_UMI"
  step5: "5_dedup"
  step6a: "6a_2BitGenome"
  step6b: "6b_effGenSize"
  step6c: "6c_computeGCbias"
  step6d: "6d_correctGCbias"
  step7a: "7a_alignmentStatistics"
  step7b: "7b_genomeCoverage"
  step8:  "8_dtriple"

##### Section 3: Program parameters #####
# Program parameters for UMI extraction with FGBio and Picard (Step 3)
#   FGBio_params: user-specified parameters for FGBio call (old version: "--read-structure 8M143T 8M143T --molecular-index-tags ZA ZB --single-tag RX")
s3_extract_UMI:
  FGBio_params: "-r 8M143T 8M143T -t ZA ZB -s RX"

# Program parameters for aligning reads with kalign (Step 4)
#   kalign_params: user-specified parameters for kalign call
#       -c, --minchimeric: minimum chimeric length as a percentage of probe length (default is 0 to disable, otherwise 15..99)
#       -l, --minacceptreadlen: after any end trimming only accept read for further processing if read is at least this length (default is 50bp, range 15..2000)
#       -d, --pairminlen:  accept paired end alignments with observed insert sizes of at least this (minimum 25, default = 100)
#       -U, --pemode: paired end processing mode: 0 - none, 1 - paired end with recover orphan ends, 2 - paired end no orphan recovery, 3 - paired end with recover orphan ends treating orphan ends as SE, 4 - paired end no orphan recovery treating orphan ends as SE (default: 0)
#   kalign_id: user-specified string to be included in output filepath
s4_read_alignment:
  kalign_params: "-c25 -l25 -d50 -U4"
  kalign_id: "pe_c25_l25_d50_U4"

# Program parameters for removing PCR and optical duplicates from alignment with Picard (Step 5)
#   Picard_params: user-specified parameters for Picard call
s5_alignment_deduplication:
  Picard_params: "--REMOVE_DUPLICATES TRUE --BARCODE_TAG RX"

##### Section 4: Intermediate output #####
# Effective genome size, extracted from the output of Step 6b
#   The number of non-N bases in the genome i.e., {total len} - {total N}
s6b_output:
  effective_genome_size: 12003433
